name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the project version
        run: |
          # The project() call may span several lines.
          version=$(tr '\n' ' ' < CMakeLists.txt | sed -nE 's/.*project\([^)]*[[:space:]]VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$version" ]; then
            echo "::error::Could not read the project VERSION from CMakeLists.txt"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract the release notes
        # Everything between "## [X.Y.Z]" and the next "## [", minus the link
        # reference lines at the bottom of the file.
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config dpkg-dev \
            qt6-base-dev qt6-wayland \
            libxcb1-dev libxcb-keysyms1-dev libxcb-xtest0-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            fonts-dejavu-core

      - name: Build and test
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release
          ctest --test-dir build-release --output-on-failure

      - name: Package
        run: |
          (cd build-release && cpack -G DEB)
          ls -l build-release/lupka_"$VERSION"_*.deb
          (cd build-release && sha256sum -- *.deb) > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Lupka $VERSION" --notes-file notes.md build-release/*.deb SHA256SUMS
